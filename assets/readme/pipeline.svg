<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="270" viewBox="0 0 1120 270" role="img" aria-labelledby="t d"><title id="t">Input, explicit command parsing into an Action, and execution or dry-run preview. Atlas is command-based, not an unrestricted autonomous desktop agent.</title><desc id="d">Input, explicit command parsing into an Action, and execution or dry-run preview. Atlas is command-based, not an unrestricted autonomous desktop agent. Conceptual command-routing artwork, not a recording of the software or a performance benchmark.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".5" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes pulse{50%{opacity:.3}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes sound{50%{transform:scaleY(.35)}}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{animation:orbit 36s linear infinite}.sound{transform-box:fill-box;transform-origin:center;animation:sound 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.sound{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="340" height="240" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 32) scale(0.8636363636363636)"><path d="M4 7h36v31H4zM11 16l7 7-7 7M25 30h8" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="99" y="60" font-family="Bahnschrift, Arial, sans-serif" font-size="18" font-weight="600" fill="#F3D962" >INPUT</text><text x="46" y="116" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#BCFCF6" >Type a command or</text><text x="46" y="150" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#BCFCF6" >recognize speech.</text><rect x="389" y="12" width="340" height="240" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(409 32) scale(0.8636363636363636)"><path d="M14 10L3 22l11 12M30 10l11 12-11 12M26 5l-8 34" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="464" y="60" font-family="Bahnschrift, Arial, sans-serif" font-size="18" font-weight="600" fill="#F3D962" >PARSE</text><text x="411" y="116" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#BCFCF6" >Map supported phrases</text><text x="411" y="150" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#BCFCF6" >to an Action.</text><rect x="754" y="12" width="340" height="240" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(774 32) scale(0.8636363636363636)"><path d="M5 6h32v34H5zM12 16l4 4 8-8M12 29h17" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="829" y="60" font-family="Bahnschrift, Arial, sans-serif" font-size="18" font-weight="600" fill="#F3D962" >EXECUTE OR PREVIEW</text><text x="776" y="116" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#BCFCF6" >Run the action, or</text><text x="776" y="150" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#BCFCF6" >inspect it with</text><text x="776" y="184" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#BCFCF6" >--dry-run.</text></svg>