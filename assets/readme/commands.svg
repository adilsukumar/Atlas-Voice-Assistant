<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="455" viewBox="0 0 1120 455" role="img" aria-labelledby="t d"><title id="t">Supported command groups: local time and date, jokes, web search, Wikipedia summaries, installed Word and Excel, YouTube, sleep and exit.</title><desc id="d">Supported command groups: local time and date, jokes, web search, Wikipedia summaries, installed Word and Excel, YouTube, sleep and exit. Conceptual command-routing artwork, not a recording of the software or a performance benchmark.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".5" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes pulse{50%{opacity:.3}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes sound{50%{transform:scaleY(.35)}}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{animation:orbit 36s linear infinite}.sound{transform-box:fill-box;transform-origin:center;animation:sound 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.sound{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="522" height="205" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 32) scale(0.9545454545454546)"><path d="M22 3a19 19 0 1 0 0 38a19 19 0 1 0 0-38M22 10v13l9 5" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="63" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="600" fill="#F3D962" >EVERYDAY UTILITIES</text><text x="46" y="119" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Read the local time or date. Tell a</text><text x="46" y="153" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >joke.</text><rect x="574" y="12" width="522" height="205" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(594 32) scale(0.9545454545454546)"><path d="M17 4a13 13 0 1 0 0 26a13 13 0 1 0 0-26M27 27l14 14" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="654" y="63" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="600" fill="#F3D962" >WEB &amp; WIKIPEDIA</text><text x="596" y="119" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Open encoded web searches or read a</text><text x="596" y="153" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >short summary.</text><rect x="24" y="232" width="522" height="205" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 252) scale(0.9545454545454546)"><path d="M8 5h26v36H8zM15 13h12M15 21h12M15 29h12" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="283" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="600" fill="#F3D962" >DESKTOP SHORTCUTS</text><text x="46" y="339" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Launch installed Word or Excel, or</text><text x="46" y="373" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >open YouTube.</text><rect x="574" y="232" width="522" height="205" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(594 252) scale(0.9545454545454546)"><path d="M30 3A19 19 0 1 0 41 31A18 18 0 0 1 30 3" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="654" y="283" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="600" fill="#F3D962" >PAUSE &amp; RETURN</text><text x="596" y="339" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Sleep until the word Atlas is</text><text x="596" y="373" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >recognized, or exit.</text></svg>