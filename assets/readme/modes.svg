<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="285" viewBox="0 0 1120 285" role="img" aria-labelledby="t d"><title id="t">Text mode uses the standard library and no microphone. Voice mode needs optional audio dependencies, Google online speech recognition and local pyttsx3 speech output.</title><desc id="d">Text mode uses the standard library and no microphone. Voice mode needs optional audio dependencies, Google online speech recognition and local pyttsx3 speech output. Conceptual command-routing artwork, not a recording of the software or a performance benchmark.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".5" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes pulse{50%{opacity:.3}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes sound{50%{transform:scaleY(.35)}}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{animation:orbit 36s linear infinite}.sound{transform-box:fill-box;transform-origin:center;animation:sound 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.sound{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="522" height="255" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 34) scale(0.9545454545454546)"><path d="M4 7h36v31H4zM11 16l7 7-7 7M25 30h8" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="62" font-family="Bahnschrift, Arial, sans-serif" font-size="29" font-weight="600" fill="#F3D962" >TEXT MODE</text><text x="46" y="116" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="600" fill="#FF4081" >STANDARD LIBRARY</text><text x="46" y="165" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >No microphone initialization. Start</text><text x="46" y="199" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >with --text, or pass a command with</text><text x="46" y="233" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >--once.</text><rect x="574" y="12" width="522" height="255" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(594 34) scale(0.9545454545454546)"><path d="M22 4a6 6 0 0 1 6 6v13a6 6 0 0 1-12 0V10a6 6 0 0 1 6-6M9 22v2a13 13 0 0 0 26 0v-2M22 37v6M14 43h16" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="654" y="62" font-family="Bahnschrift, Arial, sans-serif" font-size="29" font-weight="600" fill="#F3D962" >VOICE MODE</text><text x="596" y="116" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="600" fill="#FF4081" >OPTIONAL DEPENDENCIES</text><text x="596" y="165" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Microphone input uses Google</text><text x="596" y="199" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >recognition. Spoken output uses</text><text x="596" y="233" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >local pyttsx3.</text></svg>