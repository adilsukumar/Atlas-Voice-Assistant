<svg xmlns="http://www.w3.org/2000/svg" width="520" height="136" viewBox="0 0 520 136" role="img" aria-labelledby="t d"><title id="t">Configuration template. Environment variable names only</title><desc id="d">Configuration template. Environment variable names only Conceptual command-routing artwork, not a recording of the software or a performance benchmark.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".5" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes pulse{50%{opacity:.3}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes sound{50%{transform:scaleY(.35)}}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{animation:orbit 36s linear infinite}.sound{transform-box:fill-box;transform-origin:center;animation:sound 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.sound{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="2" y="2" width="516" height="132" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(20 24) scale(0.9090909090909091)"><path d="M5 6h14q4 0 4 4q0-4 4-4h14v31H27q-4 0-4 4q0-4-4-4H5zM23 10v31" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="80" y="49" font-family="Bahnschrift, Arial, sans-serif" font-size="28" font-weight="600" fill="#F3D962" >Configuration template</text><text x="21" y="104" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#BCFCF6" >Environment variable names only</text></svg>