<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-labelledby="t d"><title id="t">voice</title><desc id="d">voice Conceptual command-routing artwork, not a recording of the software or a performance benchmark.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".5" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes pulse{50%{opacity:.3}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes sound{50%{transform:scaleY(.35)}}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{animation:orbit 36s linear infinite}.sound{transform-box:fill-box;transform-origin:center;animation:sound 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.sound{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><g transform="translate(2 2) scale(0.9545454545454546)"><path d="M22 4a6 6 0 0 1 6 6v13a6 6 0 0 1-12 0V10a6 6 0 0 1 6-6M9 22v2a13 13 0 0 0 26 0v-2M22 37v6M14 43h16" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g></svg>