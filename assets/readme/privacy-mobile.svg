<svg xmlns="http://www.w3.org/2000/svg" width="640" height="615" viewBox="0 0 640 615" role="img" aria-labelledby="t d"><title id="t">Voice recognition sends captured speech to Google. Speech output is local. Web search and Wikipedia contact services when requested. Text mode does not use the microphone.</title><desc id="d">Voice recognition sends captured speech to Google. Speech output is local. Web search and Wikipedia contact services when requested. Text mode does not use the microphone. Conceptual command-routing artwork, not a recording of the software or a performance benchmark.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".5" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes pulse{50%{opacity:.3}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes sound{50%{transform:scaleY(.35)}}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{animation:orbit 36s linear infinite}.sound{transform-box:fill-box;transform-origin:center;animation:sound 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.sound{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="185" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 32) scale(0.9090909090909091)"><path d="M11 35a10 10 0 0 1-2-20a14 14 0 0 1 27-1a10 10 0 0 1 0 21z" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="61" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" fill="#F3D962" >RECOGNITION</text><text x="46" y="117" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#F8F8F3" >Captured speech is sent to Google’s</text><text x="46" y="151" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#F8F8F3" >recognition service.</text><rect x="24" y="212" width="592" height="185" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 232) scale(0.9090909090909091)"><path d="M4 17h9L27 5v34L13 27H4zM33 14q10 8 0 16M37 7q17 15 0 30" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="261" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" fill="#F3D962" >SPOKEN OUTPUT</text><text x="46" y="317" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#F8F8F3" >pyttsx3 uses the speech engine installed on</text><text x="46" y="351" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#F8F8F3" >the computer.</text><rect x="24" y="412" width="592" height="185" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 432) scale(0.9090909090909091)"><path d="M17 4a13 13 0 1 0 0 26a13 13 0 1 0 0-26M27 27l14 14" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="461" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" fill="#F3D962" >REQUESTED NETWORK USE</text><text x="46" y="517" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#F8F8F3" >Web search and Wikipedia contact their</text><text x="46" y="551" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#F8F8F3" >services when requested.</text></svg>