<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="t d"><title id="t">Atlas. Small commands, clear actions. Originally built by Adil Sukumar. Read the parser, try a dry run and explore the educational assistant.</title><desc id="d">Atlas. Small commands, clear actions. Originally built by Adil Sukumar. Read the parser, try a dry run and explore the educational assistant. Conceptual command-routing artwork, not a recording of the software or a performance benchmark.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".5" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes pulse{50%{opacity:.3}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes sound{50%{transform:scaleY(.35)}}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{animation:orbit 36s linear infinite}.sound{transform-box:fill-box;transform-origin:center;animation:sound 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.sound{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><text x="32" y="54" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="600" fill="#FF4081" >ATLAS / ORIGINALLY BUILT BY ADIL SUKUMAR</text><text x="30" y="157" font-family="Bahnschrift, Arial, sans-serif" font-size="72" font-weight="700" fill="#F8F8F3" letter-spacing="-1.5">Small commands.</text><text x="30" y="232" font-family="Bahnschrift, Arial, sans-serif" font-size="83" font-weight="700" fill="#BCFCF6" letter-spacing="-2">Clear actions.</text><text x="32" y="299" font-family="Bahnschrift, Arial, sans-serif" font-size="27" font-weight="400" fill="#A783F7" >An educational assistant with a command path</text><text x="32" y="333" font-family="Bahnschrift, Arial, sans-serif" font-size="27" font-weight="400" fill="#A783F7" >you can read and test.</text><g transform="translate(930 234) scale(0.65)"><circle r="84" fill="#141320" stroke="#343044" stroke-width="2"/><circle r="124" fill="none" stroke="#343044"/><g transform="translate(-25 -25) scale(1.1363636363636365)"><path d="M22 4a6 6 0 0 1 6 6v13a6 6 0 0 1-12 0V10a6 6 0 0 1 6-6M9 22v2a13 13 0 0 0 26 0v-2M22 37v6M14 43h16" fill="none" stroke="#BCFCF6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M0 0L-130 -95" fill="none" stroke="#A783F7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-130" cy="-95" r="32" fill="#141320" stroke="#FF4081" class="pulse" style="animation-delay:-0.0s"/><g transform="translate(-147 -112) scale(0.7727272727272727)"><path d="M17 4a13 13 0 1 0 0 26a13 13 0 1 0 0-26M27 27l14 14" fill="none" stroke="#F3D962" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M0 0L118 -100" fill="none" stroke="#A783F7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="118" cy="-100" r="32" fill="#141320" stroke="#FF4081" class="pulse" style="animation-delay:-1.7s"/><g transform="translate(101 -117) scale(0.7727272727272727)"><path d="M22 3a19 19 0 1 0 0 38a19 19 0 1 0 0-38M22 10v13l9 5" fill="none" stroke="#F3D962" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M0 0L0 145" fill="none" stroke="#A783F7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="0" cy="145" r="32" fill="#141320" stroke="#FF4081" class="pulse" style="animation-delay:-3.4s"/><g transform="translate(-17 128) scale(0.7727272727272727)"><path d="M8 5h26v36H8zM15 13h12M15 21h12M15 29h12" fill="none" stroke="#F3D962" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><g class="orbit"><circle cx="84" cy="0" r="5" fill="#F3D962"/></g></g><text x="32" y="416" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="600" fill="#F3D962" >Read the parser. Try a dry run. Make it yours.</text></svg>