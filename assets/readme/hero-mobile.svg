<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" role="img" aria-labelledby="t d"><title id="t">Atlas Voice Assistant. A small Python assistant for explicit voice or text commands. Python 3.11+, text-first testing and optional microphone input. Educational project.</title><desc id="d">Atlas Voice Assistant. A small Python assistant for explicit voice or text commands. Python 3.11+, text-first testing and optional microphone input. Educational project. Conceptual command-routing artwork, not a recording of the software or a performance benchmark.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".5" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes pulse{50%{opacity:.3}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes sound{50%{transform:scaleY(.35)}}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{animation:orbit 36s linear infinite}.sound{transform-box:fill-box;transform-origin:center;animation:sound 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.sound{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><text x="32" y="48" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="600" fill="#BCFCF6" >ATLAS / VOICE &amp; TEXT COMMANDS</text><text x="24" y="219" font-family="Bahnschrift, Arial, sans-serif" font-size="174" font-weight="700" fill="url(#foil)" letter-spacing="-8">ATLAS</text><text x="32" y="316" font-family="Bahnschrift, Arial, sans-serif" font-size="59" font-weight="600" fill="#F8F8F3" >A few words.</text><text x="32" y="383" font-family="Bahnschrift, Arial, sans-serif" font-size="51" font-weight="600" fill="#FF4081" >A useful shortcut.</text><text x="32" y="445" font-family="Bahnschrift, Arial, sans-serif" font-size="27" font-weight="400" fill="#BCFCF6" >A small Python assistant for explicit,</text><text x="32" y="479" font-family="Bahnschri