<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="245" viewBox="0 0 1120 245" role="img" aria-labelledby="t d"><title id="t">Use --once with --dry-run to preview one supplied command without microphone initialization or browser/application launch.</title><desc id="d">Use --once with --dry-run to preview one supplied command without microphone initialization or browser/application launch. Conceptual command-routing artwork, not a recording of the software or a performance benchmark.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".5" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes pulse{50%{opacity:.3}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes sound{50%{transform:scaleY(.35)}}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{animation:orbit 36s linear infinite}.sound{transform-box:fill-box;transform-origin:center;animation:sound 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.sound{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="1072" height="210" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 37) scale(1.0)"><path d="M4 7h36v31H4zM11 16l7 7-7 7M25 30h8" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="112" y="75" font-family="Bahnschrift, Arial, sans-serif" font-size="28" font-weight="600" fill="#F8F8F3" >TRY A COMMAND WITHOUT A MICROPHONE</text><text x="46" y="139" font-family="Bahnschrift, Arial, sans-serif" font-size="29" font-weight="600" fill="#F3D962" >--once  &quot;search cats &amp; dogs&quot;  --dry-run</text><text x="46" y="190" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" fill="#BCFCF6" >Preview the action without opening a browser or launching an application.</text></svg>