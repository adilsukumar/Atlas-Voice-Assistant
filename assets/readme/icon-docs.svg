<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-labelledby="t d"><title id="t">docs</title><desc id="d">docs Conceptual command-routing artwork, not a recording of the software or a performance benchmark.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".5" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes pulse{50%{opacity:.3}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes sound{50%{transform:scaleY(.35)}}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{animation:orbit 36s linear infinite}.sound{transform-box:fill-box;transform-origin:center;animation:sound 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.sound{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><g transform="translate(2 2) scale(0.9545454545454546)"><path d="M5 6h14q4 0 4 4q0-4 4-4h14v31H27q-4 0-4 4q0-4-4-4H5zM23 10v31" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g></svg>